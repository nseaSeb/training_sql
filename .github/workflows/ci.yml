name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  kit:
    name: SQL kit and exercises against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: training_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d training_sql"
          --health-interval 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: kit
      PGPASSWORD: kit
      PGDATABASE: training_sql
    steps:
      - uses: actions/checkout@v7
      - run: psql -v ON_ERROR_STOP=1 -q -f docker/99_settings.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f kit/01_setup_base.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f kit/03_solutions.sql > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Every exercise solution passes its own check, wrong answers fail
        run: npm run test:exercises
        working-directory: app
        env:
          DATABASE_URL: postgres://kit:kit@localhost:5432/training_sql
