name: training_sql
# docker compose up -d          → tout le training sur http://localhost:47180
# docker compose up -d training_sql_pg → la base seule, pour npm run dev
services:
  training_sql_pg:
    image: postgres:16
    container_name: training_sql_pg
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: training_sql
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    ports:
      - "55433:5432"
    volumes:
      - training_sql_data:/var/lib/postgresql/data
      - ./kit/01_setup_base.sql:/docker-entrypoint-initdb.d/01_setup_base.sql:ro
      - ./docker/99_settings.sql:/docker-entrypoint-initdb.d/99_settings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d training_sql"]
      interval: 3s
      retries: 20
  app:
    build: .
    container_name: training_sql_app
    environment:
      DATABASE_URL: postgres://kit:kit@training_sql_pg:5432/training_sql
      TZ: Europe/Paris
    ports:
      - "47180:5000"
    volumes:
      - training_sql_app_data:/srv/app/.data
    depends_on:
      training_sql_pg:
        condition: service_healthy
volumes:
  training_sql_data:
  training_sql_app_data:
